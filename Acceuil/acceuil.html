<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil & Catalogue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Défilement fluide lors du clic sur les liens */
        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #0f172a; /* Fond sombre */
            color: #ffffff;
        }

        /* --- SECTION HERO (ACCUEIL) --- */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh; /* Plein écran */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Dégradé en fondu vers la couleur de fond (#0f172a) */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2) 0%, rgba(15, 23, 42, 0.8) 75%, #0f172a 100%);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .btn-catalogue {
            display: inline-block;
            padding: 14px 32px;
            background-color: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }

        .btn-catalogue:hover {
            background-color: #2563eb;
            transform: translateY(-3px);
        }

        /* Flèche de défilement vers le bas */
        .scroll-down {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            color: #ffffff;
            font-size: 2rem;
            text-decoration: none;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -10px); }
            60% { transform: translate(-50%, -5px); }
        }

        /* --- SECTION CATALOGUE --- */
        .catalogue-section {
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 40px;
            color: #3b82f6;
        }

        /* Grille des produits */
        .grid-produits {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        /* Carte de produit */
        .carte-produit {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #334155;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .carte-produit:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .carte-produit img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .carte-produit h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #f8fafc;
        }

        .carte-produit p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .prix {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
        }

        /* Bouton Retour en haut */
        .back-to-top {
            display: block;
            text-align: center;
            margin-top: 50px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .back-to-top:hover {
            color: #3b82f6;
        }
    </style>
</head>
