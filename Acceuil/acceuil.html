<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil & Catalogue</title>
    <link rel="stylesheet" href="stylesClear.css">
</head>
<body>

    <!-- 1. SECTION ACCUEIL (HERO) -->
    <section class="hero" id="accueil">
        <img class="hero-img" src="WhatsApp Image 2026-09-01 at 10.10.32 AM (3).jpeg" alt="Produit 1">
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1 class="hero-title">Bienvenue dans Notre Collection</h1>
            <!-- Redirige vers la section catalogue plus bas dans la même page -->
            <a href="#catalogue" class="btn-catalogue">Voir le Catalogue</a>
        </div>

        <!-- Flèche animée pour faire défiler -->
        <a href="#catalogue" class="scroll-down">↓</a>
    </section>

    <!-- 2. SECTION CATALOGUE -->
    <section class="catalogue-section" id="catalogue">
        <h2 class="section-title">Les categories de nos produit</h2>

        <div class="grid-produits">
            
            <!-- Produit 1 -->
            <div class="carte-produit">
                <img src="photo (7).jpeg" alt="Produit 1">
                <h3>Les Mouchoires</h3>
                <a href="mouchoires.html" class="prix"> voir tout les mouchoires</a>
            </div>

            <!-- Produit 2 -->
            <div class="carte-produit">
                <img src="photo (5).jpeg" alt="Produit 1">
                <h3>Les papiers cuisines</h3>
                <a href="PapierCuisines.html" class="prix"> voir tout les papiers cuisines</a>
            </div>

            <!-- Produit 3 -->
            <div class="carte-produit">
                <img src="photo (3).jpeg" alt="Produit 1">
                <h3>Les papiers geniques</h3>
                <a href="PapierGenique.html" class="prix"> voir tout les papiers geniques</a>
            </div>

        </div>

        <a href="#accueil" class="back-to-top">↑ Remonter à l'accueil</a>
    </section>

</body>
</html>
